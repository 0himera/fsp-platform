services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://arena:arena@db:5432/arena?sslmode=disable
      HTTP_ADDR: :8080
      FRONTEND_DIR: /app/frontend
      MIGRATIONS_DIR: /app/migrations
      SEED_ORGANIZER_EMAIL: organizer@arena.local
      SEED_ORGANIZER_PASSWORD: change-me-for-local-demo
      DEMO_SEED: "1"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
